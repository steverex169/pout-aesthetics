# POUT Aesthetics — legacy URL redirects
#
# Include this file INSIDE the HTTPS server block for poutspa.com.
# These are permanent (301) redirects. Keep the targets on the canonical
# https://poutspa.com host to avoid redirect chains.
#
# Custom 404 handling: this file is included inside the HTTPS server block.
# The exact internal location serves the branded page while Nginx retains
# the original 404 response status.
error_page 404 /404.html;
location = /404.html {
    internal;
}

# Branded server and gateway error page (original HTTP status is preserved).
error_page 500 502 503 504 /500.html;
location = /500.html {
    internal;
}
#
# IMPORTANT: the server's existing `location /` must use
# `try_files $uri $uri/ =404;` (not `/index.html` as the fallback), so an
# unknown path reaches error_page instead of returning the homepage with 200.
# Keep `index index.html;` so the real homepage still loads at `/`.
#
# Service URLs: support both the reported trailing-slash form and the
# equivalent no-trailing-slash form.

location ~ ^/services/skinpen-microneedling/?$ {
    return 301 https://poutspa.com/services/skinpen-microneedling.html;
}

location ~ ^/services/prp-treatments/?$ {
    return 301 https://poutspa.com/services/prp-treatments.html;
}

location ~ ^/services/acne-bootcamp/?$ {
    return 301 https://poutspa.com/services/acne-bootcamp.html;
}

location ~ ^/services/botox-dysport-daxxify/?$ {
    return 301 https://poutspa.com/services/botox-dysport-daxxify.html;
}

location ~ ^/services/lip-flip/?$ {
    return 301 https://poutspa.com/services/lip-flip.html;
}

location ~ ^/services/facials/?$ {
    return 301 https://poutspa.com/services/facials.html;
}

location ~ ^/services/facial-balancing/?$ {
    return 301 https://poutspa.com/services/facial-balancing.html;
}

location ~ ^/services/liquid-lipo/?$ {
    return 301 https://poutspa.com/services/liquid-lipo.html;
}

# The cancellation policy is currently a route in the homepage application.
location = /cancellation-policy/ {
    return 301 https://poutspa.com/#/cancellation-policy;
}
location = /cancellation-policy {
    return 301 https://poutspa.com/#/cancellation-policy;
}

# No standalone Pout Party page exists in the repository; the Specials
# section is the closest existing destination.
location = /poutparty.html {
    return 301 https://poutspa.com/#/specials;
}
